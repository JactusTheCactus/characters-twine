name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Tweego
        run: |
          V=2.1.1
          TWEEGO_VERSION=v$V
          FILE=tweego-$V-linux-x64.zip
          URL=https://github.com
          URL+=/tmedwards
          URL+=/tweego
          URL+=/releases
          URL+=/download
          URL+=/$TWEEGO_VERSION
          URL+=/$FILE
          curl -L $URL -o $FILE
          ls -lh $FILE
          sudo mkdir -p /opt/tweego
          sudo unzip -o $FILE -d /opt/tweego
          sudo chmod +x /opt/tweego/tweego
          echo /opt/tweego >> $GITHUB_PATH
      - name: Build Site
        run: ./.sh
      - name: Cleanup
        run: |
          find . -name "*.zip" -exec rm {} \;
      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-commit: Update" || :
          git push
