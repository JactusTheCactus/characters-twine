name: Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Tweego
        run: |
          TWEEGO_VERSION="v2.1.1"
          FILE="tweego-2.1.1-linux-x64.zip"
          URL="https://github.com/tmedwards/tweego/releases/download/${TWEEGO_VERSION}/${FILE}"
          curl -L "$URL" -o "$FILE"
          ls -lh "$FILE"
          sudo mkdir -p /opt/tweego
          sudo unzip -o "$FILE" -d /opt/tweego
          sudo chmod +x /opt/tweego/tweego
          echo "/opt/tweego" >> $GITHUB_PATH
      - name: Build Site
        run: |
          echo ":: StoryStylesheet [stylesheet]" > src/StoryStylesheet.tw
          npx sass src/.scss --no-source-map >> src/StoryStylesheet.tw
          tweego src -o index.html
      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-commit: Update" || :
          git push
